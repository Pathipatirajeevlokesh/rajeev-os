<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d14" />
    <meta name="description" content="RAJEEV.OS is Rajeev Lokesh's personal engineering system for exploring cloud infrastructure, intelligent software, AI systems and automation." />
    <meta property="og:title" content="RAJEEV.OS — Engineering System" />
    <meta property="og:description" content="A personal engineering system for exploring cloud infrastructure, intelligent software, AI systems and automation." />
    <meta property="og:type" content="website" />
    <script>
      (() => {
        const stored = localStorage.getItem('rajeev-os-theme');
        const systemLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        const theme = stored === 'light' || (stored !== 'dark' && systemLight) ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>RAJEEV.OS — Engineering System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
